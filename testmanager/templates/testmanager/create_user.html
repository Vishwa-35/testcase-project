{% extends 'testmanager/base.html' %}
{% load static %}
{% block title %}Create New User{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'testmanager/css/create_user.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="form-card card">
        <div class="form-header">
            <h4 class="mb-0">
                <i class="bi bi-person-plus me-2"></i>Create New User
            </h4>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-person me-1"></i>Username *
                        </label>
                        <input type="text" name="username" class="form-control" required 
                               placeholder="Enter username">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-envelope me-1"></i>Email *
                        </label>
                        <input type="email" name="email" class="form-control" required 
                               placeholder="Enter email">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-lock me-1"></i>Password *
                        </label>
                        <input type="password" name="password" class="form-control" required 
                               placeholder="Enter password">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-card-text me-1"></i>Full Name *
                        </label>
                        <input type="text" name="full_name" class="form-control" required 
                               placeholder="Enter full name">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-id-card me-1"></i>Employee ID *
                        </label>
                        <input type="text" name="employee_id" class="form-control" required 
                               placeholder="Enter employee ID">
                    </div>
                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-briefcase me-1"></i>Role *
                    </label>
                    <select name="role" class="form-select" required>
                        <option value="">Select Role</option>
                        {% for value, label in roles %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                </div>

                <div class="d-flex gap-2 justify-content-end mt-4">
                    <a href="{% url 'admin_page' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-submit">
                        <i class="bi bi-check-circle me-1"></i>Create User
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
