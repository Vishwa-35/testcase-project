<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Reset Sent - Test Case Manager</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .done-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .done-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            text-align: center;
        }
        
        .done-body {
            padding: 48px 24px;
        }
        
        .done-icon {
            font-size: 64px;
            color: #28a745;
            margin-bottom: 24px;
        }
        
        .done-card h3 {
            color: #333;
            margin-bottom: 16px;
        }
        
        .done-card p {
            color: #666;
            margin-bottom: 32px;
        }
        
        .btn-back {
            background: linear-gradient(135deg, #0052A5 0%, #046CFF 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-back:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 82, 165, 0.3);
        }
    </style>
</head>
<body>
    <div class="done-container">
        <div class="done-card">
            <div class="done-body">
                <div class="done-icon">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <h3>Password Reset Email Sent</h3>
                <p>
                    If an account exists with that email address, we've sent password reset instructions.
                    Please check your email and follow the link to reset your password.
                </p>
                <a href="{% url 'login' %}" class="btn btn-back">
                    <i class="bi bi-arrow-left me-1"></i>Back to Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
