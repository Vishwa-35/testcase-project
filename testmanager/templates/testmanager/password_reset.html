<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot Password - Test Case Manager</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .reset-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .reset-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .reset-header {
            background: linear-gradient(135deg, #0052A5 0%, #046CFF 100%);
            color: white;
            padding: 32px 24px;
            text-align: center;
        }
        
        .reset-header h2 {
            margin: 0;
            font-weight: 600;
            font-size: 24px;
        }
        
        .reset-header p {
            margin: 8px 0 0 0;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .reset-body {
            padding: 32px 24px;
        }
        
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #0052A5;
            box-shadow: 0 0 0 3px rgba(0, 82, 165, 0.1);
        }
        
        .btn-reset {
            background: linear-gradient(135deg, #0052A5 0%, #046CFF 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 82, 165, 0.3);
            color: white;
        }
        
        .reset-links {
            margin-top: 24px;
            text-align: center;
        }
        
        .reset-links a {
            color: #0052A5;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        .reset-links a:hover {
            color: #046CFF;
            text-decoration: underline;
        }
        
        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
        }
        
        .input-group-icon {
            position: relative;
        }
        
        .input-group-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            z-index: 10;
        }
        
        .input-group-icon .form-control {
            padding-left: 44px;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <h2><i class="bi bi-key me-2"></i>Forgot Password</h2>
                <p>Enter your email to reset password</p>
            </div>
            
            <div class="reset-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group-icon">
                            <i class="bi bi-envelope"></i>
                            <input type="email" name="email" class="form-control" 
                                   placeholder="yourname@tvsmotor.com" 
                                   value="{{ email|default:'' }}" required>
                        </div>
                        <small class="form-text text-muted">Must be a @tvsmotor.com email address</small>
                    </div>
                    
                    <button type="submit" class="btn btn-reset">
                        <i class="bi bi-send me-2"></i>Send Reset Link
                    </button>
                </form>
                
                <div class="reset-links">
                    <a href="{% url 'login' %}">
                        <i class="bi bi-arrow-left me-1"></i>Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Validate email domain on submit
        document.querySelector('form').addEventListener('submit', function(e) {
            const email = document.querySelector('[name="email"]').value;
            if (email && !email.endsWith('@tvsmotor.com')) {
                e.preventDefault();
                alert('Email must be a @tvsmotor.com address.');
                return false;
            }
        });
    </script>
</body>
</html>
